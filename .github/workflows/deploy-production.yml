name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 24 traz npm 11. Versões anteriores do npm resolvem os peers de
      # typescript-eslint de outro jeito e quebram o `npm ci` com
      # "Missing: typescript@5.9.3 from lock file".
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build:prd

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local_path: 'dist/*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=10'

      # A action monta um `put -r <local_path>` e o shell expande o glob, então
      # `dist/*` não pega arquivos ocultos. O .htaccess precisa ir à parte.
      - name: Deploy .htaccess via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local_path: 'dist/.htaccess'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=10'
